name: 'build-test'
on: # rebuild any PRs and main branch changes
  pull_request:
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'

jobs:
  build-test: # make sure build/ci work properly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
  test-output: # make sure the action works on a clean machine without building
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: oldstable
      - name: Install Pulumi CLI
        uses: ./
      - run: |
          pulumi login --local
          pulumi stack init dev
        working-directory: .github/test-stacks/golang
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run Pulumi Up
        uses: ./
        if: always()
        id: pulumi
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: up
          cloud-url: file://~
          stack-name: dev
          upsert: true
          work-dir: .github/test-stacks/golang
          config-map: "{name: {value: test, secret: false}}"
          suppress-progress: true
          log-verbosity: 6
          debug: true
      - run: echo 'The random string is `${{ steps.pulumi.outputs.name }}`'
      - name: Get Outputs
        uses: ./
        if: always()
        id: pulumioutput
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: output
          cloud-url: file://~
          stack-name: organization/golang/dev
      - run: echo 'The random string is `${{ steps.pulumioutput.outputs.name }}`'
      - name: Compare Outputs
        id: compare
        run: |
          if [[ "$OUTPUT1" != "$OUTPUT2" ]]; then
            echo "Outputs are not equal!"
            exit 1
          fi
        env:
          OUTPUT1: ${{ steps.pulumi.outputs.name }}
          OUTPUT2: ${{ steps.pulumioutput.outputs.name }}
  test-update-plan: # make sure the action works on a clean machine without building
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: oldstable
      - name: Install Pulumi CLI
        uses: ./
      - run: |
          pulumi login --local
          pulumi stack init dev
        working-directory: .github/test-stacks/golang
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generate Update Plan via Pulumi Preview
        uses: ./
        if: always()
        id: pulumi-preview
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: preview
          cloud-url: file://~
          stack-name: dev
          upsert: true
          work-dir: .github/test-stacks/golang
          config-map: "{name: {value: test, secret: false}}"
          plan: /tmp/update-plan.json
          suppress-progress: true
          log-verbosity: 6
          debug: true
      - name: Apply Update Plan via Pulumi Up
        uses: ./
        if: always()
        id: pulumi-up
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: up
          cloud-url: file://~
          stack-name: dev
          upsert: true
          work-dir: .github/test-stacks/golang
          config-map: "{name: {value: test, secret: false}}"
          plan: /tmp/update-plan.json
          suppress-progress: true
          log-verbosity: 6
          debug: true
      - run: echo 'The random string is `${{ steps.pulumi-up.outputs.name }}`'
  test-pr-version: # test installing Pulumi from a PR build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      # Match the installer's CI run selection and require a live artifact.
      - name: Find a merged PR with a CLI artifact
        id: get-pr
        run: |
          set -euo pipefail
          candidates=$(gh pr list --repo pulumi/pulumi --state merged --limit 50 \
            --json number,headRefOid,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | [.number, .headRefOid] | @tsv')
          while IFS=$'\t' read -r pr sha; do
            [[ -n "$pr" ]] || continue
            run_id=$(gh api "repos/pulumi/pulumi/actions/runs?head_sha=$sha" --jq '
              [.workflow_runs[] | select(any(.referenced_workflows[]?; .path | contains("ci.yml")))]
              | sort_by(.run_started_at // "") | reverse | .[0].id // empty')
            if [[ -z "$run_id" ]]; then
              echo "Skipping PR #$pr: no CI run"
              continue
            fi
            available=$(gh api "repos/pulumi/pulumi/actions/runs/$run_id/artifacts?name=artifacts-cli-linux-amd64" \
              --jq 'any(.artifacts[]; .expired == false)')
            if [[ "$available" == "true" ]]; then
              echo "pr-number=$pr" >> "$GITHUB_OUTPUT"
              echo "Using PR #$pr (CI run $run_id)"
              exit 0
            fi
            echo "Skipping PR #$pr: no unexpired Linux CLI artifact in CI run $run_id"
          done <<< "$candidates"
          echo "::error::No usable CLI artifact found among the 50 most recent merged PRs"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Pulumi from PR
        uses: ./
        with:
          pulumi-version: pr#${{ steps.get-pr.outputs.pr-number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Pulumi version
        run: |
          INSTALLED_VERSION=$(pulumi version)
          echo "Installed version: $INSTALLED_VERSION"
          # Verify the version starts with 'v' and contains 'alpha' (PR builds are alpha versions)
          if [[ ! "$INSTALLED_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha ]]; then
            echo "Error: Expected PR build version format (v*.*.*-alpha*), got $INSTALLED_VERSION"
            exit 1
          fi
          echo "Successfully installed PR build: $INSTALLED_VERSION"
