name: Update dist files
on:
  push:
    branches:
      - main

env:
  ESC_ACTION_ENVIRONMENT: pulumi/imports/github-secrets
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: GITHUB_TOKEN=PULUMI_BOT_TOKEN

jobs:
  update-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate with Pulumi Cloud
        id: pulumi-auth
        uses: pulumi/auth-actions@159c3e431aab767d4519b96f3f784d7d3d725622 # v2
        with:
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization
          export-environment-variables: false
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@v4
        with:
          pulumi-access-token: ${{ steps.pulumi-auth.outputs.pulumi-access-token }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: dist/**
          add_options: -u --force
          commit_message: 'chore(dist): Update dist [automated commit]'
          commit_user_name: Pulumi Bot
          commit_user_email: pulumi-bot@users.noreply.github.com
permissions: write-all # Equivalent to default permissions plus id-token: write
